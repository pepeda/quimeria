<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta property="og:title" content="Quimèria · joc de bestioles">
<meta property="og:description" content="Videojoc per al mòbil, en català. Recull bestioles, fes-les créixer i explora cinc mons. No cal instal·lar res.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://pepeda.github.io/quimeria/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&family=Bangers&display=swap">
<style>
/* Layout: a phone-sized game column beside a comments panel; on narrow screens the game fills the screen and the comments open as a sheet from a button in the top bar. Single bright look on purpose. */
:root{
  --sand:#FFF3E3; --paper:#FFFFFF; --ink:#1E1B2E; --muted:#47435C; --line:#E4DCCE; --soft:#F4F1FA;
  --accent:#4A3FB5; --accent-d:#2F2780; --gold:#F7C948; --gold-d:#C98A00; --good:#2E8B4A; --good-d:#1D5E31; --bad:#C0392B;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:#2A2443;color:var(--ink);font-family:var(--body);font-size:15px}
.app{display:flex;gap:20px;justify-content:center;align-items:flex-start;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phone{width:min(430px,100%);height:min(900px,calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)));background:var(--sand);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{display:flex;gap:6px;align-items:center;padding:10px 12px 6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:4px 12px 4px 6px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.screen{flex:1;overflow-y:auto;padding:4px 12px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.screen>*{flex-shrink:0}
.house{position:relative;border-radius:18px;overflow:hidden;line-height:0}
.house>svg{width:100%;height:auto;display:block}
.house .in{position:absolute;transform:translate(-50%,-100%);line-height:1;text-align:center;font-size:11px;font-weight:800}
.tree{display:flex;flex-direction:column;align-items:center}
.tree .lvl{display:flex;gap:10px;justify-content:center;width:100%}
.tree .box{width:min(150px,46%)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:28px;font-weight:800} h2{font-size:21px;font-weight:800} h3{font-size:17px;font-weight:800}
p{margin:0;line-height:1.4}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.flat{background:var(--paper);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
button{font:inherit;cursor:pointer;color:inherit}
/* Everything tappable is raised; everything else is flat. */
.btn{border:none;border-radius:14px;min-height:48px;padding:8px 16px;font-weight:800;font-size:16px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 0 #000;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.btn.light{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.btn.green{background:var(--good);box-shadow:0 4px 0 var(--good-d)}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-d)}
.btn.sm{min-height:42px;font-size:14px;padding:6px 12px}
.btn:disabled,.opt:disabled,.tap:disabled{opacity:1;background:#E3E0EA;color:#5E5A72;box-shadow:none;border-color:#CFCAD9;cursor:default;transform:none}
.opt{border:2px solid var(--ink);background:#fff;border-radius:16px;padding:10px 40px 10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:56px;position:relative;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt::after{content:"";position:absolute;right:14px;top:50%;width:11px;height:11px;border-right:3px solid currentColor;border-top:3px solid currentColor;transform:translateY(-50%) rotate(45deg)}
.opt:disabled::after{display:none}
.opt b{font-size:16px}.opt .d{font-size:14px;color:var(--muted)}
.opt .need{font-size:13px;font-weight:800;color:#5E5A72}
.tap{border:2px solid var(--ink);background:#fff;border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:13px;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.tap:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tap.sel{background:#EEEBFF;border-color:var(--accent);box-shadow:0 4px 0 var(--accent)}
.tap.off{background:#ECE9F2}
.box{background:#fff;border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:13px}
.box.off{background:#ECE9F2;color:#5E5A72}
.btn:focus-visible,.opt:focus-visible,.tap:focus-visible,.navb:focus-visible,textarea:focus-visible,input:focus-visible,.chip:focus-visible,.world:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.bar{height:10px;border-radius:999px;background:#E6E1D6;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .35s ease-out}
.bar>i.ghost{background:#F5B7B1;transition:width .6s ease-out .3s}
.tag{font-size:13px;font-weight:800;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--muted)}
.tag.good{background:#DDF3E2;color:#1F6B35}.tag.mid{background:#FFF1C2;color:#6B4A00}.tag.bad{background:#FDE2DE;color:#9E2B1F}
.stars{color:#C98A00;letter-spacing:1px;font-size:15px}
.tip{background:#2F2780;color:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tip .btn{align-self:flex-start;min-height:40px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #9C93F5}
nav.nav[hidden]{display:none}
nav.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:8px 8px 10px;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -4px 18px rgba(30,27,46,.1)}
.navb{border:none;background:none;border-radius:14px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:12px;color:#5E5A72}
.navb.on{background:#FFE08A;color:var(--ink)}
.navb.hint{animation:pulse 1.4s ease-in-out infinite;background:#EEEBFF;color:var(--accent)}
.map{position:relative;height:460px;width:390px;margin:0 auto;max-width:100%}
.world{position:absolute;width:100px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:14px;padding:0}
.ring{width:94px;height:94px;border-radius:50%;padding:5px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.world .ball{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.badge{position:absolute;right:-10px;top:-8px;background:var(--ink);color:#fff;font-size:12px;border-radius:999px;padding:2px 7px;border:2px solid #fff}
/* route strip */
.route{display:flex;align-items:center;gap:0;overflow-x:auto;padding:4px 2px}
.node{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#E3E0EA;color:#5E5A72;font-weight:800;font-size:13px;border:2px solid #fff}
.node.done{color:#fff}
.node.cur{animation:pulse 1.2s ease-in-out infinite;box-shadow:0 0 0 4px rgba(74,63,181,.35)}
.link{flex:1 0 8px;height:4px;background:#D9D4E3;min-width:6px}
.link.done{background:#9C93F5}
/* scenes */
.scene{position:relative;border-radius:20px;overflow:hidden;line-height:0}
.scene .crew{position:absolute;left:8px;bottom:6px;display:flex;align-items:flex-end;gap:2px;line-height:1}
.scene .label{position:absolute;left:10px;top:8px;line-height:1.2;background:rgba(255,255,255,.92);border-radius:999px;padding:2px 10px;font-weight:800;font-size:14px}
.event{background:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.risk{display:inline-flex;gap:3px;align-items:center;font-size:13px;font-weight:800}
.risk i{width:10px;height:10px;border-radius:50%;display:inline-block;background:#E3E0EA}
.risk i.on{background:#C0392B}
/* battle */
.stage{position:relative;background:linear-gradient(#2E2650,#4A3F7A);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;color:#fff;overflow:hidden}
.foe{display:flex;gap:12px;align-items:center;position:relative}
.foe-art{position:relative;flex:0 0 auto}
.foe-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.foe .bar{background:#5A4E8C}
.warn{display:none;background:#F7C948;color:var(--ink);border-radius:999px;padding:2px 10px;font-weight:800;font-size:13px;align-self:flex-start}
.warn.on{display:inline-block;animation:pulse .8s ease-in-out infinite}
.caption{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;font-weight:700;font-size:15px;min-height:40px;line-height:1.3}
.banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--display);font-weight:800;font-size:28px;color:var(--ink);background:#FFE08A;padding:6px;transform:translateX(-110%);pointer-events:none;z-index:5}
.banner.show{animation:bannerIn 1.1s ease-out forwards}
.squad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;position:relative}
.mem{background:rgba(255,255,255,.95);color:var(--ink);border-radius:14px;padding:6px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:13px;font-weight:800;position:relative}
.mem .bar{width:100%}
.mem.ko{filter:grayscale(1);opacity:.55}
.mem.ko .cr{transform:rotate(90deg)}
.ab{width:100%;min-height:48px;border:none;border-radius:12px;font-weight:800;font-size:13px;background:#F7C948;color:var(--ink);box-shadow:0 3px 0 #C98A00;line-height:1.1;padding:4px}
.ab.ready{animation:glow 1.2s ease-in-out infinite}
.ab:disabled{background:#E3E0EA;color:#5E5A72;box-shadow:none;animation:none}
.charge{width:100%;height:9px;border-radius:999px;background:#E3E0EA;overflow:hidden}
.charge i{display:block;height:100%;width:0;background:#F7C948;transition:width .4s}
.charge.full i{background:#FF8A00}
.charge.full{animation:pulse .7s ease-in-out infinite}
.cutin{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(100deg,rgba(0,0,0,.85) 0 16%,var(--cc) 16% 84%,rgba(0,0,0,.85) 84%);animation:cutin 1s ease-out forwards}
.cutin .lines{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.55) 0deg 3deg,transparent 3deg 11deg);animation:spin 1s linear}
.cutin .who{position:relative;animation:slideIn .45s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.cutin .sname{position:absolute;bottom:10%;left:0;right:0;text-align:center;font-family:var(--display);font-weight:800;font-size:34px;line-height:1;color:#fff;-webkit-text-stroke:2px #1E1B2E;paint-order:stroke;transform:skewX(-12deg);animation:slam .45s .15s both}
.particle{position:absolute;left:35%;top:35%;opacity:0;animation:incoming .5s ease-in forwards;line-height:0}
.rise{position:absolute;left:50%;bottom:10%;line-height:0;animation:rise .9s ease-out forwards}
@keyframes cutin{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes slideIn{0%{transform:translateX(-160%) scale(1.5)}100%{transform:translateX(0) scale(1.5)}}
@keyframes slam{0%{transform:skewX(-12deg) scale(2.6);opacity:0}100%{transform:skewX(-12deg) scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(30deg)}}
@keyframes incoming{0%{opacity:1;transform:translate(-150px,170px) scale(.6) rotate(0)}100%{opacity:1;transform:translate(0,0) scale(1.4) rotate(220deg)}}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}
.ab-row{width:100%;display:flex;flex-direction:column;gap:1px}
.ab-row span{font-size:10px;font-weight:800;line-height:1.1;text-align:left;color:#47435C}
.ab-row.locked span{color:#9C98AE}
.stchips{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
.stchip{font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;background:rgba(255,255,255,.2);color:#fff}
.stchip.burn{background:#F26B3A}.stchip.poison{background:#3DAA5C}.stchip.stun{background:#F2B90F;color:#1E1B2E}.stchip.soak{background:#2E8BE6}.stchip.weak{background:#9B59E0}
.stchip.good{background:#DDF3E2;color:#1F6B35}
.cutin.combo{background:linear-gradient(100deg,rgba(0,0,0,.85) 0 12%,var(--cc) 12% 50%,var(--cc2) 50% 88%,rgba(0,0,0,.85) 88%)}
.cutin .pair{display:flex;gap:18px;position:relative}
.syn{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;background:#2F2780;color:#fff}
.stage .result{position:absolute;left:10px;right:10px;top:10px;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.caption.us{background:rgba(61,220,132,.3)}.caption.them{background:rgba(255,80,70,.42)}
.cutin .side{position:absolute;top:7%;left:0;right:0;text-align:center;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.2em;color:#fff}
.cutin.enemy{background:repeating-linear-gradient(135deg,#1B0A0A 0 18px,#5A0F0F 18px 36px)}
.cutin.enemy .lines{background:repeating-conic-gradient(from 0deg,rgba(255,70,60,.55) 0deg 3deg,transparent 3deg 11deg)}
.cutin.enemy .sname{color:#FFE08A;-webkit-text-stroke:2px #5A0F0F;font-size:38px}
.cutin .foeIn{animation:foeIn .45s cubic-bezier(.2,1.4,.4,1) both,shake .3s linear .5s 2}
@keyframes foeIn{0%{transform:translateY(-140%) scale(1.6)}100%{transform:translateY(0) scale(1.6)}}
.stage{gap:8px}.ab-row span{font-size:9.5px}

.sfx{position:absolute;top:-6px;transform:translate(-50%,0) rotate(var(--rot,0deg));font-family:'Bangers','Baloo 2',sans-serif;font-size:26px;letter-spacing:.04em;padding:8px 14px;color:#1E1B2E;background:#FFE14D;clip-path:polygon(0% 22%,12% 0%,25% 15%,40% 0%,52% 14%,68% 0%,78% 16%,100% 6%,90% 32%,100% 52%,88% 66%,100% 92%,74% 82%,60% 100%,46% 84%,30% 100%,20% 82%,0% 94%,8% 62%,0% 44%,10% 34%);z-index:7;pointer-events:none;white-space:nowrap;line-height:1;animation:sfxIn 1s ease-out forwards}
.sfx.r{background:#FF4A2E;color:#fff}.sfx.w{background:#fff;color:#C0392B}.sfx.b{background:#7CC0FF}.sfx.g{background:#9BE36B}
.sfx.big{font-size:40px;padding:10px 18px}
.sfx.stay{left:72%;top:8px;animation:sfxStay .5s ease-out forwards;font-size:24px}
@keyframes sfxIn{0%{transform:translate(-50%,0) rotate(var(--rot,0deg)) scale(.2);opacity:0}15%{transform:translate(-50%,0) rotate(var(--rot,0deg)) scale(1.3);opacity:1}30%{transform:translate(-50%,0) rotate(var(--rot,0deg)) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-12px) rotate(var(--rot,0deg)) scale(1.05)}}
@keyframes sfxStay{0%{transform:translate(-50%,0) rotate(-8deg) scale(.2)}70%{transform:translate(-50%,0) rotate(-8deg) scale(1.25)}100%{transform:translate(-50%,0) rotate(-8deg) scale(1)}}
.stage.impact{filter:invert(1) contrast(1.5)}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.6px) 0 0/7px 7px;pointer-events:none}
.stage .cr,.cutin .cr,.bigcard .cr{filter:drop-shadow(1.6px 0 0 #111) drop-shadow(-1.6px 0 0 #111) drop-shadow(0 1.6px 0 #111) drop-shadow(0 -1.6px 0 #111)}
.cutin{border:5px solid #111;box-shadow:inset 0 0 0 4px #fff;transform:rotate(-1.5deg)}
.cutin::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.3) 1.3px,transparent 1.8px) 0 0/6px 6px;pointer-events:none}
.cutin .sname,.cutin .side{font-family:'Bangers','Baloo 2',sans-serif;letter-spacing:.05em}
.cutin .sname{font-size:40px}
.pop-num{font-family:'Bangers','Baloo 2',sans-serif;-webkit-text-stroke:1.5px #111;paint-order:stroke;letter-spacing:.03em}
.caption{background:#fff;color:#1E1B2E;border:3px solid #111;border-radius:6px}
.caption.us{background:#E6FFEF;border-color:#1F6B35;color:#123D20}.caption.them{background:#FFE3DF;border-color:#9E2B1F;color:#5A140D}
.bigcard{box-shadow:6px 6px 0 #111}
.bigcard .art::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.12) 1.2px,transparent 1.6px) 0 0/6px 6px;pointer-events:none}

.mseq{position:absolute;inset:0;z-index:60;background:#0D0B12;padding:10px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.1fr 1fr 1.2fr;gap:8px;cursor:pointer}
.mp{position:relative;overflow:hidden;border:4px solid #000;box-shadow:0 0 0 2px #fff;opacity:0;animation:panelIn .35s ease-out forwards;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0}
.mp.wide{grid-column:1/-1}
.mp::after{content:"";position:absolute;inset:0;background:radial-gradient(rgba(0,0,0,.22) 1.3px,transparent 1.8px) 0 0/6px 6px;pointer-events:none}
.mbox{position:absolute;left:8px;top:8px;background:#fff;border:3px solid #000;padding:4px 9px;font-weight:800;font-size:14px;max-width:85%;color:#111;z-index:3;line-height:1.2}
.mname{font-family:'Bangers','Baloo 2',sans-serif;font-size:36px;letter-spacing:.04em;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke;text-align:center;line-height:1;z-index:2;position:relative;padding:0 8px;transform:skewX(-10deg)}
.mp[style*="#fff"] .mname{color:#C0392B}
.mdesc{font-size:13px;font-weight:700;color:#111;text-align:center;padding:0 12px;z-index:2;position:relative;line-height:1.3}
.mteam{display:flex;gap:6px;justify-content:center;z-index:2;position:relative}
.mscared{position:relative;display:inline-block;animation:shake .3s linear infinite}
.mscared b{position:absolute;right:-6px;top:-8px;font-family:'Bangers',sans-serif;color:#C0392B;font-size:18px}
.msil .cr{filter:brightness(0) drop-shadow(0 0 6px #FF3B30) drop-shadow(0 0 2px #FF3B30)!important}
.meyes{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%)}
.meyes .cr{filter:drop-shadow(0 0 10px var(--cc)) contrast(1.3)!important}
.mfoe{animation:foeIn .5s cubic-bezier(.2,1.4,.4,1) both;z-index:2;position:relative}
.mcrack{position:absolute;inset:0;width:100%;height:100%}
.mskip{position:absolute;right:14px;bottom:4px;color:#fff;font-size:12px;font-weight:800;z-index:5}
@keyframes panelIn{0%{opacity:0;transform:scale(1.18) rotate(-1.5deg)}100%{opacity:1;transform:none}}
.shield{display:none;position:absolute;inset:-6px;border-radius:18px;border:3px solid #7CC0FF;background:rgba(124,192,255,.18);pointer-events:none}
.shield.on{display:block;animation:pulse 1.4s ease-in-out infinite}
.pop-num{position:absolute;left:50%;top:10%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:24px;line-height:1;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:floatUp .9s ease-out forwards;z-index:6;white-space:nowrap}
.pop-num.dmg{color:#FF5A4E}.pop-num.heal{color:#3DDC84}.pop-num.big{font-size:32px}
.pop-num.tagtxt{font-size:15px;top:-6%;color:#FFE08A}
.lunge{animation:lunge .3s ease-out}
.lungeDown{animation:lungeDown .3s ease-out}
.shake{animation:shake .32s linear}
.flash{animation:flash .25s linear}

.bigcard .art{width:100%;height:150px;display:flex;align-items:center;justify-content:center;position:relative}
.bigcard .art .cr{animation:unshadow .8s ease-out}
.bigcard .rar{position:absolute;left:10px;top:10px;font-size:13px;font-weight:800;color:#fff;border-radius:999px;padding:2px 10px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
@keyframes unshadow{0%,35%{filter:brightness(0) opacity(.5)}100%{filter:none}}
.modal{position:absolute;inset:0;background:rgba(30,27,46,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;border-radius:26px 26px 0 0;padding:14px;width:100%;max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.toast{position:absolute;left:12px;right:12px;bottom:92px;z-index:30;background:var(--ink);color:#fff;border-radius:14px;padding:12px;font-weight:800;font-size:15px;animation:pop .3s ease-out}
.cr{display:block}
.role{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px 1px 5px;color:#fff;line-height:1.4;white-space:nowrap}
.role.Atac{background:#C0392B}.role.Defensa{background:#2E6BC6}.role.Curador{background:#2E8B4A}
.delta{font-size:14px;font-weight:800;border-radius:8px;padding:2px 8px}
.delta.up{background:#DDF3E2;color:#1F6B35}.delta.down{background:#FDE2DE;color:#9E2B1F}.delta.eq{background:var(--soft);color:var(--muted)}
/* end-of-run chest: a tap that raises the tier shakes and glows it; the open chest pops */
.chest{border:none;background:none;padding:0;cursor:pointer;line-height:0;align-self:center;min-height:48px}
.chest.up svg{animation:chestUp .45s ease-out}
.chest.opened svg{animation:chestOpen .55s ease-out}
.chestgot{margin:0;padding-left:18px;font-weight:700;display:flex;flex-direction:column;gap:3px;align-self:stretch}
@keyframes chestUp{0%{transform:scale(1) rotate(0)}25%{transform:scale(1.08) rotate(-7deg)}55%{transform:scale(1.14) rotate(6deg);filter:drop-shadow(0 0 14px #FFE27A)}100%{transform:scale(1) rotate(0)}}

.st-mid{min-width:250px}

/* a new critter of species sp: forma 1 (stage 0), level 1 */
function mk(sp){return {uid:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),sp:sp,stage:0,evo:-1,lvl:1,xp:0,fat:0,rest:0}}
/* version of the save format: a save of another version is kept as a backup and a new game starts */
var SAVE_V=3;
function newGame(){
  return {v:SAVE_V,niu:[],chest:null,megas:{},coins:150,built:{},owned:[mk('brotet'),mk('gotim'),mk('espurnet'),mk('xispa')],food:{planta:1,aigua:1},items:[],equip:{},runs:{},active:null,done:{},completed:0,psiquic:false,
    screen:'explorar',world:null,path:null,pick:[],detail:null,summary:null,seen:{},tips:{explorar:1,mon:1,equip:1,run:1},story:{},tut:{done:0},restClock:Date.now(),started:new Date().toISOString()};
}
var G=(function(){var raw=null,g=null;try{raw=localStorage.getItem(S_KEY)}catch(e){storageOk=false}
  try{g=raw?JSON.parse(raw):null}catch(e){g=null}
  /* an unreadable save or a save of an older version (before levels and forms): keep a copy and start a new game */
  if(raw&&(!g||typeof g!=='object'||g.v!==SAVE_V)){try{localStorage.setItem(S_KEY+'.bak-'+Date.now(),raw)}catch(e){}g=null}
  if(!g)g=newGame();var d=newGame();Object.keys(d).forEach(function(k){if(g[k]===undefined||g[k]===null)g[k]=d[k]});
  /* repair the critter lists. Unknown species are dropped only in 99-boot.js, after every species file has run */
  ['owned','niu'].forEach(function(k){if(!Array.isArray(g[k]))g[k]=[];g[k]=g[k].filter(function(c){return c&&typeof c==='object'&&c.sp});
    g[k].forEach(function(c){c.stage=Math.max(0,Math.min(3,c.stage|0));c.lvl=Math.max(1,Math.min(BAL.LEVEL_MAX,c.lvl|0||1));c.xp=Math.max(0,+c.xp||0);c.fat=c.fat|0;c.rest=c.rest|0})});
  if(!g.owned.length)g.owned=d.owned;
  if(!Array.isArray(g.items))g.items=[];['equip','built','food','runs','done','seen','tips','story','tut'].forEach(function(k){if(typeof g[k]!=='object'||Array.isArray(g[k]))g[k]={}});
  return g})();
G.seen=G.seen||{};G.tips=G.tips||{};G.story=G.story||{};if(!G.tut||typeof G.tut.done!=="number")G.tut={done:(G.completed>0||G.owned.length>4)?1:0};G.restClock=G.restClock||Date.now();
function persist(){save(S_KEY,G)}

function sp(c){return SPECIES[c.sp]}
function byUid(u){for(var i=0;i<G.owned.length;i++)if(G.owned[i].uid===u)return G.owned[i];return null}
/* every critter you have: at home (G.owned) and in the Niu (G.niu) */
function allCr(){return G.owned.concat(G.niu||[])}
function anyByUid(u){return allCr().filter(function(c){return c.uid===u})[0]||null}
function inNiu(c){return (G.niu||[]).indexOf(c)>=0}
/* name: forma 4 adds a word to the name of its forma 3 */
function cName(c){return c.stage?sp(c).evos[c.evo].n+(c.stage>=3?' '+FORM4_WORD:''):sp(c).n}
function cEl2(c){return c.stage?(sp(c).evos[c.evo].el2||''):''}
function lvl(c){return c.lvl||1}
function form(c){return c.stage+1}
/* experience: XP needed to go from level L to L+1; the highest level of the critter's form */
function xpNeed(L){return Math.round(BAL.XP_FIRST*Math.pow(BAL.XP_GROWTH,L-1))}
function levelCap(c){return BAL.FORM_CAP[c.stage]}
/* can it still gain XP? Not when it is at the highest level of its form with a full bar */
function canXp(c){return lvl(c)<levelCap(c)||c.xp<xpNeed(lvl(c))}
/* gives n XP; returns how many levels it went up. At the cap of its form the bar fills and waits for the evolution */
function addXp(c,n){var up=0;c.xp=(c.xp||0)+n;
  while(c.lvl<levelCap(c)&&c.xp>=xpNeed(c.lvl)){c.xp-=xpNeed(c.lvl);c.lvl++;up++}
  if(c.lvl>=levelCap(c))c.xp=Math.min(c.xp,xpNeed(c.lvl));return up}
function maxFat(c){return BAL.FATIGUE[c.stage]}
/* evolving: the rule for this critter's next form, and the copies it would use (lowest form and level first) */
function evoRule(c){return sp(c).legend?null:BAL.EVOLVE[c.stage]||null}
function copyPool(c){var R=evoRule(c);if(!R)return [];
  return allCr().filter(function(x){return x!==c&&x.sp===c.sp&&x.stage>=R.copyForm-1&&!busyWorld(x)&&G.pick.indexOf(x.uid)<0})
    .sort(function(a,b){return a.stage-b.stage||a.lvl-b.lvl||(a.xp||0)-(b.xp||0)})}
/* what is missing to evolve: {ok, rule, copies (to use), missing: [texts]} */
function evoCheck(c){var R=evoRule(c);if(!R)return {ok:false,final:true,missing:[]};
  var pool=copyPool(c),miss=[],need=R.copies-Math.min(R.copies,pool.length);
  if(lvl(c)<R.level)miss.push('Ha d’arribar al nivell '+R.level+' (ara és al '+lvl(c)+')');
  if(need>0)miss.push('Et '+(need>1?'falten ':'falta ')+need+(need>1?' còpies':' còpia')+' de forma '+R.copyForm+(R.copyForm>1?' o més':''));
  return {ok:!miss.length&&!busyWorld(c),rule:R,copies:pool.slice(0,R.copies),missing:miss}}
function cap(){var n=6;BUILD.forEach(function(b){n+=(G.built[b.k]||0)*b.cap});return n}
function bonusPct(eq){var b={atk:0,def:0,hp:0};Object.keys(eq).forEach(function(s){var it=IT(eq[s]);if(it){b.atk+=it.atk*3;b.def+=it.def*3;b.hp+=it.hp*2}});var P=powerOf(eq);return {atk:Math.round(b.atk+P.atk),def:Math.round(b.def+P.def),hp:Math.round(b.hp+P.hp)}}
function stats(c,eq){var b=ROLE[sp(c).role],k=(1+BAL.STAT_PER_LEVEL*(lvl(c)-1))*BAL.FORM_MULT[c.stage]*(sp(c).legend?BAL.LEGEND_MULT:1),q=bonusPct(eq||G.equip);
  return {hp:Math.round(b.hp*k*(1+q.hp/100)),atk:Math.round(b.atk*k*(1+q.atk/100)),def:Math.round(b.def*k*(1+q.def/100)),heal:Math.round(b.heal*k)}}
function busyWorld(c){for(var w in G.runs)if(G.runs[w].team.indexOf(c.uid)>=0)return w;return null}
function run(){return G.active?G.runs[G.active]:null}
function effMult(c,d){if(sp(c).all)return 1.5;var a=sp(c).el,b=cEl2(c);return b?0.7*mult(a,d)+0.3*mult(b,d):mult(a,d)}
function dmg(atk,m,def){return Math.max(1,Math.round(atk*m-def*0.5))}
function worldOpen(w){return w!=='psiquic'||G.psiquic}
function ownsSp(s){return allCr().some(function(c){return c.sp===s})}
function speciesOf(w){return SP_ORDER.filter(function(s){return SPECIES[s].el===w})}
/* evolved forms you have (forma 2, 3 and 4 of each branch) */
function formsOwned(){var f={};allCr().forEach(function(c){if(c.stage)f[c.sp+':'+c.stage+':'+c.evo]=1});return Object.keys(f).length}
function starsN(L){return Math.max(1,Math.min(5,Math.round(L)))}
function starStr(n){var s='';for(var i=0;i<5;i++)s+=i<n?'★':'☆';return '<span class="stars" aria-label="Dificultat '+n+' de 5">'+s+'</span>'}
function pathL(w,path){return TIER[w]+(path==='llarg'?1:0)}
function worldScenes(w){return Object.keys(SCENES).filter(function(id){var s=SCENES[id];return (s.pool==='gen'||s.pool==='land'||s.pool==='fork'||(s.pool==='sig'&&s.world===w))})}
/* real-time rest: 1 point every 10 minutes at home (2 with the spa, and double again at night with the campfire) */
function applyRestClock(){
  var now=Date.now();if(!(G.restClock<=now))G.restClock=now;var steps=Math.floor((now-G.restClock)/600000);
  if(steps<=0)return;G.restClock+=steps*600000;
  var per=(G.built.spa?2:1)*Math.min(steps,20);
  G.owned.forEach(function(c){if(busyWorld(c))return;if(c.rest>0){c.rest=Math.max(0,c.rest-per);if(!c.rest)c.fat=0}else c.fat=Math.max(0,c.fat-per)});
  /* campfire (house): at night, from 21:00 to 8:00, the rest counts double */
  var hr=new Date().getHours();if(!G.built.foguera||(hr>=8&&hr<21))return;
  per=Math.min(steps,20);
  G.owned.forEach(function(c){if(busyWorld(c))return;if(c.rest>0){c.rest=Math.max(0,c.rest-per);if(!c.rest)c.fat=0}else c.fat=Math.max(0,c.fat-per)});

var resetArm=false,abandonArm=null,restartArm=false,buildArm=null;
/* ================= ACTIONS ================= */
/* one tap on a button with data-act: a is the action, d its data-* values */
function act(a,d){
  /* house: element rooms stay locked until that world is finished; area headings fold */
  if(a==='build'){var bd=h14Item(d.k);if(bd&&!h14Open(bd)){toast('Primer has d’acabar: '+ELS[bd.el].mon+'.');return}}
  if(a==='hfold'){G.hFold=G.hFold||{};G.hFold[d.k]=!h14Folded(d.k);persist();render();return}
  /* forge: choose 1 power out of 3 */
  if(a==='forge'){var t=tierOf(d.id);if(t<4&&fcount(d.id)>=4&&G.coins>=FORGE_COST[t]){G.forgeChoice={id:d.id,opts:shuffle(AFF_KEYS).slice(0,3)};G.mtab='obj';snd('tap')}else toast('Et falten objectes o monedes.');render();scrollTop0();return}
  if(a==='forgePick'){var fc=G.forgeChoice;G.forgeChoice=null;if(fc&&fc.opts.indexOf(d.k)>=0&&forgeOnce(fc.id,d.k)){var lf=IT(G.lastForge);snd('forge');toast('Forjat: '+lf.n+' ('+TIER_N[lf.tier]+') amb '+AFFIX[d.k].n+'!')}persist();render();return}
  if(a==='forgeCancel'){G.forgeChoice=null;render();return}
  if(a==='forgeAll'){var n=forgeAll();if(n)snd('forge');toast(n?'Has forjat '+n+' objecte'+(n>1?'s':'')+' (poders a l’atzar).':'No hi ha res per forjar.');persist();render();return}
  /* backpack tabs, sound switch, collection order, legend workshop */
  if(a==='mtab'){G.mtab=d.k;render();scrollTop0();return}
  if(a==='mute'){G.mute=!G.mute;persist();render();if(!G.mute)snd('tap');return}
  if(a==='sortB'){G.sortB=d.k;persist();render();return}
  if(a==='legend'){buyLegend(d.el);persist();render();return}
  /* the chest after a won expedition */
  if(a==='chestTap'){chestTap();persist();render();return}
  /* every other action changes the game, then the screen is drawn again */
  var r=run();
  if(a!=='reset')resetArm=false;if(a!=='abandon')abandonArm=null;if(a!=='restart')restartArm=false;if(a!=='build')buildArm=null;
  if(a==='chat'){$('chat').classList.add('open');$('fbText').focus();return}
  switch(a){
    case 'tip':G.tips[d.k]=1;break;
    case 'help':showHelp(false);return;
    case 'nav':G.screen=d.to;G.detail=null;break;
    case 'world':if(tutOn()&&d.w!=='aigua'){toast('Primer prova el món d’Aigua.');break}if(!worldOpen(d.w)){toast('Aquest món encara és desconegut. Completa 3 expedicions.');break}G.world=d.w;G.screen='mon';break;
    case 'path':G.zone=+d.p;G.pick=tutOn()&&G.world==='aigua'&&!G.zone?tutPick():[];G.screen='equip';break;
    case 'pick':var i=G.pick.indexOf(d.u);if(i>=0)G.pick.splice(i,1);else if(G.pick.length<maxTeam())G.pick.push(d.u);else toast('Ara nom\u00e9s hi caben '+maxTeam()+' bestioles.');break;
    case 'go':if(G.pick.length&&needOk()){if(G.pick.length<2)toast('Amb poques bestioles és més difícil!');startRun()}break;
    case 'resume':G.active=d.w;G.screen='run';break;
    case 'pause':stopBattle();G.active=null;G.screen='explorar';toast('Aventura guardada. Hi pots tornar quan vulguis.');break;
    case 'abandon':if(abandonArm!==d.w){abandonArm=d.w;break}abandonArm=null;abandonRun(d.w);break;
    case 'restart':if(!restartArm){restartArm=true;break}restartArm=false;restartRun();break;
    case 'restartNow':restartRun();break;
    case 'choice':var S=SCENES[r.scene],ch=S.nodes[r.node].ch[+d.i];if(ch.req&&!teamHas(ch.req))break;applyEffect(ch.out);break;
    case 'fork':r.slots[r.i].scene=d.s;enterScene(d.s);break;
    case 'gfight':startBattle({el:r.world,L:r.L+0.6,guardian:true,final:true,n:'Guardi\u00e0 de '+ZONES[r.world][r.zone||0]});break;
    case 'mfight':startBattle({el:r.world,L:r.L,waves:2,n:'Campament de monstres',win:{rand:[[0.5,{loot:'common'}],[0.5,{coins:40}]]}});break;
    case 'mleave':applyEffect({dmgTeam:15});break;
    case 'gleave':finishRun(false,true);break;
    case 'bwin':battleWon();break;
    case 'blose':if(r.event.enemy.wild){r.team.forEach(function(u){if(r.hp[u]<=0)r.hp[u]=1});advance()}else finishRun(false);break;
    case 'wfight':startBattle({wild:r.event.sp,L:r.L+(r.event.rare?1:0),rare:r.event.rare});break;
    case 'wfeed':var ws=SPECIES[r.event.sp];G.food[ws.el]--;recruitCard(r.event.sp,r.event.rare);break;
    case 'skip':case 'next':advance();break;
    case 'claim':claimCard();if(r.event.last){r.i=r.slots.length;finishRun(true)}else advance();break;
    case 'join':var nu=r.event.uid;if(r.team.length<3){r.team.push(nu)}else{var kou=r.team.filter(function(u){return r.hp[u]<=0})[0];if(kou){r.team[r.team.indexOf(kou)]=nu;delete r.hp[kou]}}if(r.team.indexOf(nu)>=0)r.hp[nu]=stats(byUid(nu)).hp;advance();break;
    case 'nap':G.owned.forEach(function(c){if(!busyWorld(c)){c.rest=0;c.fat=0}});toast('Han fet la migdiada. Ja estan a punt!');break;
    case 'build':if(buildArm!==d.k){buildArm=d.k;break}buildArm=null;var bd=BUILD.filter(function(x){return x.k===d.k})[0];if(bd&&G.coins>=bd.price&&(G.built[bd.k]||0)<bd.max){G.coins-=bd.price;G.built[bd.k]=(G.built[bd.k]||0)+1;toast(bd.n+': fet!')}break;
    case 'detail':G.detail=d.s;break;
    case 'close':G.detail=null;break;
    case 'adopt':var Sp=SPECIES[d.s];if(!Sp.legend&&G.coins>=Sp.price&&G.owned.length<cap()&&worldOpen(Sp.el)){G.coins-=Sp.price;G.owned.push(mk(d.s));toast(Sp.n+' viu ara a casa teva!')}break;
    case 'feed':var c=anyByUid(d.u);if(c&&G.food[d.el]>0&&canXp(c)){G.food[d.el]--;var fx=d.el===sp(c).el?BAL.XP_FOOD_OWN:BAL.XP_FOOD,fup=addXp(c,fx);toast(cName(c)+' ha menjat: +'+fx+' XP'+(fup?'. Puja al nivell '+lvl(c)+'!':'.'))}break;
    /* evolve: needs the level and the copies (evoCheck); the copies are used up. Forma 3 chooses a branch, forma 4 keeps it */
    case 'evolve':var c2=anyByUid(d.u),ei=+d.i,chk=c2&&evoCheck(c2);if(chk&&chk.ok&&((c2.stage===0&&ei===0)||(c2.stage===1&&ei>0)||(c2.stage===2&&ei===c2.evo))){
      chk.copies.forEach(removeCritter);c2.stage++;c2.evo=ei;addXp(c2,0);toast('Ara és '+cName(c2)+'! ('+chk.copies.length+(chk.copies.length>1?' còpies fetes servir)':' còpia feta servir)'));snd('evolve');buzz([40,40,80])}break;
    /* the Niu: bring a critter home, send one to the Niu, or swap one of the Niu with one of the house */
    case 'niuHome':var nh=anyByUid(d.u);if(nh&&inNiu(nh)&&G.owned.length<cap()){G.niu.splice(G.niu.indexOf(nh),1);G.owned.push(nh);G.niuSwap=null;toast(cName(nh)+' ja és a casa.')}break;
    case 'toNiu':var tn=byUid(d.u);if(tn&&!busyWorld(tn)&&G.owned.length>1){G.owned.splice(G.owned.indexOf(tn),1);var pk=G.pick.indexOf(tn.uid);if(pk>=0)G.pick.splice(pk,1);tn.fat=0;tn.rest=0;G.niu.push(tn);toast(cName(tn)+' descansa al Niu.')}break;
    case 'niuPick':G.niuSwap=G.niuSwap===d.u?null:d.u;break;
    case 'niuSwap':var na=anyByUid(d.u),hb=byUid(d.h);if(na&&inNiu(na)&&hb&&!busyWorld(hb)){G.niu[G.niu.indexOf(na)]=hb;G.owned[G.owned.indexOf(hb)]=na;var pk2=G.pick.indexOf(hb.uid);if(pk2>=0)G.pick.splice(pk2,1);hb.fat=0;hb.rest=0;G.niuSwap=null;toast(cName(na)+' va a casa i '+cName(hb)+' al Niu.')}break;
    case 'equip':var ix=G.items.indexOf(d.id);if(ix<0||!IT(d.id))break;var sl=d.slot;G.items.splice(ix,1);if(G.equip[sl])G.items.push(G.equip[sl]);G.equip[sl]=d.id;toast(IT(d.id).n+' equipat.');break;

  }

/* ---------- route ---------- */
function buildRoute(w,z){
  var used=[];
  return ZONE_ROUTES[z].map(function(k){
    if(k==='fork')return {k:'fork',opts:['tenda','cova'],scene:null};
    if(k==='fork2'){var a=pickScene('gen',w,used),b=pickScene('land',w,used);return {k:'fork',opts:[a,b],scene:null}}
    if(k==='guardian'||k==='mini'||k==='cave')return {k:k};
    if(k==='spring')return {k:'spring',scene:'font'};
    return {k:k,scene:pickScene(k,w,used)};
  });
}
function startRun(){
  var w=G.world,z=G.zone||0,hp={};
  G.pick.forEach(function(u){hp[u]=stats(byUid(u)).hp});
  var tu=tutOn()&&w==='aigua'&&!z;
  G.runs[w]={world:w,zone:z,L:zoneL(w,z),i:0,slots:tu?TUT_ROUTE.map(function(k,i){return k==='gen'?{k:k,scene:pickScene('gen',w,[])}:k==='spring'?{k:k,scene:'font'}:k==='wild'?{k:k,sp:tutWild()}:{k:k}}):buildRoute(w,z),tut:tu?1:0,team:G.pick.slice(),hp:hp,coins:0,cave:null,scene:null,node:'a',event:null,reveal:0,bless:0};
  G.active=w;G.pick=[];G.screen='run';arrive();
}
function arrive(){
  var r=run();if(!r)return;
  if(r.i>=r.slots.length){finishRun(true);return}
  var s=r.slots[r.i];
  if(s.k==='fork'&&!s.scene){r.event={type:'fork'};return}
  if(s.k==='guardian'){r.event={type:'guardianPre'};return}
  if(s.k==='mini'){r.event={type:'miniPre'};return}
  if(s.k==='wild'){r.event={type:'wild',sp:s.sp,rare:false};return}
  if(s.k==='fight'){startBattle({el:r.world,L:Math.max(0.5,r.L-0.3)});return}
  if(s.k==='cave'){r.cave=newCave(1);enterScene(r.cave.list[0]);return}
  enterScene(s.scene);
}
function newCave(lvl){return {lvl:lvl,i:0,list:['cova-tunels',pickOne(['cova-cristalls','cova-ratpenats','cova-bolets','cova-llac']),pickOne(['cova-ratpenats','cova-mina','cova-cristalls','cova-bolets']),lvl>=3?'cova-rei':'cova-escala']}}
function enterScene(id){
  var r=run();r.scene=id;r.node='a';r.event={type:'scene'};
  G.seen[r.world]=G.seen[r.world]||{};G.seen[r.world][id]=1;
}
function advance(){
  var r=run();if(!r)return;
  if(r.cave){r.cave.i++;if(r.cave.i<r.cave.list.length){enterScene(r.cave.list[r.cave.i]);return}r.cave=null;toast('Surts de la cova i tornes al camí.')}
  r.i++;arrive();
}
function caveL(r){return r.cave?0.5+0.6*(r.cave.lvl-1):0}
function startBattle(o){var r=run(),b=makeBattle(o);if(r.bless){b.tm.buff=3;r.bless=0;b.caption='La benedicció us dona +30% de mal!'}r.event=b}
function applyEffect(e){
  var r=run();if(!e){advance();return}
  if(e.shop||e.buyFood||e.price){var disc=teamTalent('mercat')?0.5:1;e=Object.assign({},e);if(e.shop)e.shop=Math.ceil(e.shop*disc);if(e.buyFood)e.buyFood=Math.ceil(e.buyFood*disc);if(e.price)e.price=Math.ceil(e.price*disc)}
  if(e.rand){var x=Math.random(),acc=0;for(var i=0;i<e.rand.length;i++){acc+=e.rand[i][0];if(x<acc){applyEffect(e.rand[i][1]);return}}applyEffect(e.rand[e.rand.length-1][1]);return}
  if(e.go){r.node=e.go;r.event={type:'scene'};return}
  if(e.exitCave){if(e.coins)r.coins+=e.coins;r.cave=null;r.i++;toast('Surts de la cova'+(e.coins?' amb '+e.coins+' monedes':'')+'.');arrive();return}
  if(e.deeper){var lv=r.cave.lvl+1;r.cave=newCave(lv);enterScene(r.cave.list[0]);toast('Baixeu al nivell '+lv+' de la cova. Ara és més perillós!');return}
  if(e.coins){var tr=teamTalent('tresor');r.event={type:'card',kind:'coins',n:Math.round(e.coins*(tr?1.5:1)),why:tr?'L\u2019Ensumatresors n\u2019ha trobat m\u00e9s!':'Has trobat monedes.'};return}
  if(e.food){r.event={type:'card',kind:'food',el:r.world,n:e.food+(teamTalent('bosc')&&!r.cave?1:0),why:'Menjar per a les bestioles.'};return}
  if(e.loot){r.event={type:'card',kind:'item',item:pickOne(e.loot==='relic'?RELICS:COMMON),why:e.loot==='relic'?'Un tresor rar!':'Un objecte per a la motxilla.'};return}
  if(e.heal){var ko=0;r.team.forEach(function(u){var c=byUid(u);if(!c)return;var mx=stats(c).hp;if(r.hp[u]<=0)ko++;r.hp[u]=Math.min(mx,Math.max(1,Math.round(r.hp[u]+(mx-r.hp[u])*e.heal/100)))});
    r.event={type:'note',title:'Descanseu',text:'L’equip recupera vida.'+(ko?' Les bestioles que estaven KO es desperten.':'')};return}
  if(e.dmgTeam){alive(r).forEach(function(c){var mx=stats(c).hp;r.hp[c.uid]=Math.max(1,r.hp[c.uid]-Math.round(mx*e.dmgTeam/100))});r.event={type:'note',title:'Ai!',text:'L’equip perd una mica de vida.'};return}
  if(e.bless){r.bless=1;r.event={type:'note',title:'Benedicció',text:'A la propera batalla, tot l’equip farà +30% de mal durant 3 torns.'};return}
  if(e.reveal){r.reveal=Math.min(r.slots.length-1,r.i+5);r.event={type:'note',title:'Des de dalt',text:'Veus els propers llocs del camí (mira les boles de dalt).'};return}
  if(e.skip){var to=Math.min(r.i+e.skip,r.slots.length-2),n=to-r.i;r.i=to;r.event={type:'note',title:'Drecera!',text:n>0?'Us salteu '+n+' llocs del camí.':'Ja sou a prop del final.'};return}
  if(e.wild){r.event={type:'wild',sp:pickOne(speciesOf(r.world)),rare:!!e.rare};return}
  if(e.fight){startBattle({el:r.world,L:r.L+(e.L||0)+caveL(r),n:e.n,win:e.win,waves:e.waves,guardian:!!e.guardian});return}
  if(e.cave){r.cave=newCave(1);enterScene(r.cave.list[0]);return}
  if(e.shop){if(r.coins>=e.shop){r.coins-=e.shop;r.event={type:'card',kind:'item',item:pickOne(COMMON),why:'L’has comprat.'}}else r.event={type:'note',title:'No tens prou monedes',text:'Necessites '+e.shop+' monedes de les que portes en aquesta aventura (en portes '+r.coins+').'};return}
  if(e.buyFood){if(r.coins>=e.buyFood){r.coins-=e.buyFood;r.event={type:'card',kind:'food',el:r.world,n:3,why:'L’has comprat.'}}else r.event={type:'note',title:'No tens prou monedes',text:'Necessites '+e.buyFood+' monedes de les que portes (en portes '+r.coins+').'};return}
  if(e.buyItem){if(r.coins>=e.price){r.coins-=e.price;r.event={type:'card',kind:'item',item:e.buyItem==='RELIC'?pickOne(RELICS):e.buyItem,why:'L’heu fet a la forja.'}}else r.event={type:'note',title:'No tens prou monedes',text:'Necessites '+e.price+' monedes de les que portes (en portes '+r.coins+').'};return}
  if(e.note){r.event={type:'note',title:'',text:e.note};return}
  advance();
}

/* enemy life, attack and defence for difficulty L and team size ts. The difficulty is FIXED for each world and zone
   (BAL.ZONE): it does not change with the strength of your team. More critters in the team make enemies a bit stronger. */
function enemyStats(L,guardian,ts){var r=run(),w=r?r.world:'foc',z=r?(r.zone||0):0,M=(BAL.ZONE[w]||BAL.ZONE.foc)[z]||[1,1,1];
  var s=1+0.22*Math.max(0,ts-3);
  var st={hp:Math.round((90+54*L)*s*(guardian?1.8:1)),atk:Math.round((8.5+4*L)*(guardian?1.1:1)*(1+0.04*Math.max(0,ts-3))),def:Math.round(5+2.5*L)};
  st.hp=Math.round(st.hp*M[0]);st.atk=Math.round(st.atk*M[1]);st.def=Math.round(st.def*M[2]);return st}
/* forma 4 auras of the team: {element: percent} of more attack and defence for team members of that element */

function battleWon(){
  var r=run(),b=r.event,en=b.enemy,P=b.P||emptyP(),L=b.enemy.L||1;
  if(b.enemy.final){r.coins+=60+20*Math.round(L);r.event={type:'card',kind:'item',item:pickOne(RELICS),why:'El guardià deixa caure un tresor rar. +'+(60+20*Math.round(L))+' monedes.',last:true}}
  else if(b.enemy.wild)recruitCard(b.enemy.wild,b.rare);
  else{
    if(b.enemy.guardian)r.coins+=60;
    if(b.win)applyEffect(b.win);
    else r.event={type:'card',kind:'coins',n:Math.round((15+10*L)*(teamTalent('tresor')?1.5:1)),why:'Has guanyat la batalla!'};
  }
  /* gear with the coins power gives more coins; a boss treasure is a legend set piece 5% of the times */
  var ev=r.event;
  if(ev&&ev.type==='card'&&ev.kind==='coins'&&P.coins)ev.n=Math.round(ev.n*(1+P.coins/100));
  var ch=en.boss?0.05:0;

function finishRun(ok,keepAll){
  var r=run();if(!r)return;if(r.tut&&G.tut)G.tut.done=1;
  var team=r.team.slice(),c0=G.coins;stopBattle();
  var z=r.zone||0,bonus=ok?ZONE_BONUS[z]:0,coins=ok||keepAll?r.coins+bonus:Math.floor(r.coins/2);
  G.coins+=coins;
  var spa=G.built.spa?2:1,tired=[];
  G.owned.forEach(function(c){
    if(r.team.indexOf(c.uid)>=0){c.fat++;if(c.fat>=maxFat(c)){c.fat=maxFat(c);c.rest=maxFat(c);tired.push(cName(c))}}
    else if(!busyWorld(c)){if(c.rest>0){c.rest=Math.max(0,c.rest-spa);if(!c.rest)c.fat=0}else c.fat=Math.max(0,c.fat-spa)}
  });

  var levels=[],xp=ok?BAL.XP_RUN_WON:BAL.XP_RUN_LOST;

  var tennis=null;

  var unlocked=false,before=maxTeam();
  if(ok){G.completed++;G.done[r.world+':z'+z]=true;if(G.completed>=3&&!G.psiquic){G.psiquic=true;unlocked=true}}
  var qwake=ok&&quimeraWake();if(qwake)setTimeout(function(){quimeraComic()},400);
  G.summary={ok:ok,keepAll:!!keepAll,coins:coins,bonus:bonus,world:r.world,zone:z,tired:tired,unlocked:unlocked,tennis:tennis,pct:0,bigger:maxTeam()>before?maxTeam():0,xp:xp,levels:levels,quimera:qwake};
  /* a won expedition gives a chest (an older chest that was never opened opens now by itself) */

  houseAfterRun(ok,team,r.world,c0);
}

  var s=G.summary||{},B=G.built,got=G.coins-c0,notes=[];
  var home=G.owned.filter(function(c){return team.indexOf(c.uid)<0&&!busyWorld(c)});
  function rest1(c){if(c.rest>0){c.rest=Math.max(0,c.rest-1);if(!c.rest)c.fat=0}else c.fat=Math.max(0,c.fat-1)}

  if(rested)notes.push(rested+(rested>1?' bestioles han':' bestiola ha')+' descansat més gràcies a la casa.');
  function coin(n,why){G.coins+=n;s.coins=(s.coins||0)+n;notes.push(why+': +'+n+' monedes.')}
  if(B.salaLlamp&&got>0){var x=Math.max(1,Math.round(got*0.1));coin(x,'Sala de bobines')}
  if(ok){
    if(B.portal)coin(25,'Portal entre mons');

  s.house=notes;
}
