<div class="app">
  <div class="phone" id="phone">
    <div class="top" id="top"></div>
    <div class="screen" id="screen"></div>
    <nav class="nav" id="nav" aria-label="Menú del joc"></nav>
    <div id="overlay"></div>
    <div id="toastSlot" aria-live="polite"></div>
  </div>

  <aside class="chat" id="chat" aria-label="Comentaris mentre jugues">
    <div class="row between">
      <h2>Comentaris mentre jugues</h2>
      <button class="btn sm light mob" id="chatClose" type="button">Tanca</button>
    </div>
    <p class="muted">Escriu què t’agrada, què no, què canviaries o quina idea tens. Cada comentari guarda on eres del joc.</p>
    <label for="who">Qui ets?<input id="who" type="text" placeholder="El teu nom" maxlength="40"></label>
    <div class="types" id="types" role="group" aria-label="Tipus de comentari"></div>
    <div class="fb-list" id="fbList" aria-live="polite"></div>
    <form id="fbForm" style="display:flex;flex-direction:column;gap:6px">
      <label for="fbText">Comentari</label>
      <textarea id="fbText" maxlength="1500" placeholder="Què t’agrada, què no, què canviaries…"></textarea>
      <div class="muted small" id="fbCtx"></div>
      <button class="btn" type="submit">Envia el comentari</button>
    </form>
    <div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:8px">
      <button class="btn green" id="fbCopy" type="button">He acabat: copia tots els comentaris</button>
      <a class="btn light" id="fbWa" href="#" target="_blank" rel="noopener" style="text-decoration:none">Envia’ls per WhatsApp</a>
      <textarea id="fbOut" readonly hidden style="min-height:120px"></textarea>
      <p class="muted" id="fbMsg"></p>
      <button class="btn sm light" id="fbClear" type="button">Esborra tots els comentaris</button>
    </div>
  </aside>
</div>
