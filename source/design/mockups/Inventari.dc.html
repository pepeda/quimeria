<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Motxilla i equipament</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1E1B2E}a:hover{color:#4A3FB5}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F1ECFA; font-family: 'Nunito', sans-serif; color: #1E1B2E; display: flex; flex-direction: column">

<div style="padding: 16px 16px 4px">
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.1">Motxilla</h1>
<p style="margin: 2px 0 0; font-size: 13px; color: #34405A">Els objectes et fan més fort. No puges de nivell: millores amb el que trobes.</p>
</div>

<div style="margin: 8px 12px 0; display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; gap: 8px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{left}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 16px; background: {{s.bg}}; border: 3px {{s.line}} {{s.border}}; display: flex; align-items: center; justify-content: center; color: #1E1B2E"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg></div>
<div style="font-size: 11px; font-weight: 800">{{s.label}}</div>
</div>
</sc-for>
</div>

<div style="height: 250px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<svg width="140" height="170" viewBox="0 0 140 170" aria-hidden="true">
<path d="M40 70 L28 160 H112 L100 70 Z" fill="#7A3FC7"></path>
<circle cx="70" cy="48" r="28" fill="#F4C6A0"></circle>
<path d="M40 46 A30 30 0 0 1 100 46 V52 H40 Z" fill="#9AA3B5" stroke="#5E6678" stroke-width="3"></path>
<circle cx="60" cy="56" r="3.5" fill="#1E1B2E"></circle>
<circle cx="80" cy="56" r="3.5" fill="#1E1B2E"></circle>
<rect x="44" y="80" width="52" height="56" rx="18" fill="#4A3FB5"></rect>
<circle cx="70" cy="90" r="5" fill="#F2B90F"></circle>
<path d="M112 70 L124 30" stroke="#5E6678" stroke-width="5" stroke-linecap="round"></path>
<path d="M18 92 L30 86 L42 92 V106 C42 114 30 120 30 120 C30 120 18 114 18 106 Z" fill="#2E8BE6" stroke="#1A5FA3" stroke-width="2.5"></path>
<rect x="46" y="136" width="18" height="16" rx="5" fill="#6B3E26"></rect>
<rect x="76" y="136" width="18" height="16" rx="5" fill="#6B3E26"></rect>
</svg>
<div style="display: flex; gap: 10px; font-size: 12px; font-weight: 800">
<span>Força 12</span><span>Defensa 9</span><span>Sort 4</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{right}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 16px; background: {{s.bg}}; border: 3px {{s.line}} {{s.border}}; display: flex; align-items: center; justify-content: center; color: #1E1B2E"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg></div>
<div style="font-size: 11px; font-weight: 800">{{s.label}}</div>
</div>
</sc-for>
</div>
</div>

<div style="margin: 8px 12px 0; display: flex; justify-content: center; gap: 16px">
<sc-for list="{{bottom}}" as="s" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 16px; background: {{s.bg}}; border: 3px {{s.line}} {{s.border}}; display: flex; align-items: center; justify-content: center; color: #1E1B2E"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg></div>
<div style="font-size: 11px; font-weight: 800">{{s.label}}</div>
</div>
</sc-for>
</div>

<div style="margin: 10px 12px 0; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 14px; padding: 8px 10px; font-size: 12px; font-weight: 700">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20 C5 15 3 12 3 9 A4 4 0 0 1 12 7 A4 4 0 0 1 21 9 C21 12 19 15 12 20 Z" fill="#E0483B"></path></svg>
Collaret de petxina: les teves bestioles curen un 10% més.
</div>

<div style="margin: 12px 12px 0; display: flex; gap: 6px" role="tablist" aria-label="Seccions de la motxilla">
<button role="tab" aria-selected="false" style="flex: 1 1 0; height: 40px; border-radius: 12px; border: none; background: #FFFFFF; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: #1E1B2E">Equipament</button>
<button role="tab" aria-selected="true" style="flex: 1 1 0; height: 40px; border-radius: 12px; border: none; background: #1E1B2E; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: #FFFFFF">Menjar</button>
<button role="tab" aria-selected="false" style="flex: 1 1 0; height: 40px; border-radius: 12px; border: none; background: #FFFFFF; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; color: #1E1B2E">Relíquies</button>
</div>

<div style="margin: 10px 12px 12px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; flex-grow: 1; align-content: start">
<sc-for list="{{food}}" as="f" hint-placeholder-count="10">
<div style="position: relative; height: 62px; border-radius: 14px; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="{{f.c}}"></circle><path d="M12 5 Q14 2 17 3" stroke="#2E7D45" stroke-width="2" fill="none" stroke-linecap="round"></path></svg>
<div style="font-size: 9px; font-weight: 800; text-align: center; line-height: 1.1">{{f.label}}</div>
<div style="position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; border-radius: 10px; background: #1E1B2E; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{f.n}}</div>
</div>
</sc-for>
</div>

<dc-import name="Nav" active="motxilla" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var R = { comu: ['#FFFFFF', '#B9B3C6', 'solid'], rar: ['#E3F0FF', '#2E8BE6', 'solid'], epic: ['#F1E3FF', '#9B59E0', 'solid'], buit: ['#F7F4FC', '#A79FB8', 'dashed'] };
    var slot = function (label, d, r) { var x = R[r]; return { label: label, d: d, bg: x[0], border: x[1], line: x[2] }; };
    return {
      left: [
        slot('Casc', 'M4 16 A8 8 0 0 1 20 16 V18 H4 Z M12 8 V5', 'comu'),
        slot('Espasa', 'M19 4 L9 14 M7 12 L12 17 M8 16 L4 20', 'rar'),
        slot('Anell', 'M12 21 A6 6 0 1 0 12 9 A6 6 0 1 0 12 21 Z M10 6 L12 3 L14 6 L12 9 Z', 'buit')
      ],
      right: [
        slot('Collaret', 'M5 4 Q12 15 19 4 M12 15 A3 3 0 1 0 12 21 A3 3 0 1 0 12 15 Z', 'epic'),
        slot('Escut', 'M12 3 L20 6 V12 C20 17 16 20 12 21 C8 20 4 17 4 12 V6 Z', 'rar'),
        slot('Anell', 'M12 21 A6 6 0 1 0 12 9 A6 6 0 1 0 12 21 Z M10 6 L12 3 L14 6 L12 9 Z', 'buit')
      ],
      bottom: [
        slot('Capa', 'M8 4 H16 L20 20 H4 Z', 'comu'),
        slot('Botes', 'M7 4 H12 V14 H18 A2 2 0 0 1 20 16 V20 H7 Z', 'comu')
      ],
      food: [
        { label: 'Baia picant', c: '#F26B3A', n: 4 },
        { label: 'Alga dolça', c: '#2E8BE6', n: 2 },
        { label: 'Fulla tendra', c: '#3DAA5C', n: 7 },
        { label: 'Fruita elèctrica', c: '#F2B90F', n: 1 },
        { label: 'Bolet somiador', c: '#9B59E0', n: 3 },
        { label: 'Pa de mel', c: '#E3B27A', n: 5 },
        { label: 'Llavor daurada', c: '#E0A800', n: 2 },
        { label: 'Perla de riu', c: '#CFE6FF', n: 1 },
        { label: 'Poma', c: '#E0483B', n: 6 },
        { label: 'Galeta', c: '#C98A5A', n: 9 }
      ]
    };
  }
}
</script>
</body>
</html>
