<div style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 800; font-size: 14px"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="6" width="16" height="8" rx="4" fill="#B5793E"></rect><circle cx="16" cy="10" r="3" fill="#E3B27A"></circle></svg>18</div>
<div style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 800; font-size: 14px"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15 L6 6 L13 4 L17 11 L12 16 Z" fill="#9AA3B5"></path></svg>7</div>
</div>
<button aria-label="Configuració" style="width: 44px; height: 44px; border-radius: 14px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1E1B2E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22 M4.9 4.9 L7 7 M17 17 L19.1 19.1 M4.9 19.1 L7 17 M17 7 L19.1 4.9"></path></svg></button>
</div>

<svg width="366" height="270" viewBox="0 0 366 270" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<rect x="0" y="236" width="366" height="34" fill="#7CC46B"></rect>
<path d="M20 96 L140 24 L260 96 Z" fill="#E2574C" stroke="#A23A31" stroke-width="3" stroke-linejoin="round"></path>
<rect x="30" y="96" width="220" height="140" fill="#8A5A3C"></rect>
<rect x="38" y="104" width="100" height="60" fill="#FDE7C8"></rect>
<rect x="142" y="104" width="100" height="60" fill="#E8F1FF"></rect>
<rect x="38" y="168" width="100" height="64" fill="#FFF7E8"></rect>
<rect x="142" y="168" width="100" height="64" fill="#F1E3FF"></rect>
<rect x="46" y="140" width="40" height="16" rx="4" fill="#E2574C"></rect>
<rect x="190" y="206" width="44" height="22" rx="6" fill="#9B59E0"></rect>
<rect x="150" y="112" width="22" height="22" rx="3" fill="#BFE3F7" stroke="#8A5A3C" stroke-width="2"></rect>

<div style="position: absolute; left: 148px; top: 140px; font-size: 10px; font-weight: 800; color: #1A5FA3">Bany</div>
<div style="position: absolute; left: 44px; top: 174px; font-size: 10px; font-weight: 800; color: #6B3E26">Sala</div>
<div style="position: absolute; left: 148px; top: 174px; font-size: 10px; font-weight: 800; color: #5B2A96">Racó de jocs</div>
<div style="position: absolute; left: 270px; top: 156px; font-size: 10px; font-weight: 800; color: #2E6B27">Jardí (nou)</div>
<div style="position: absolute; left: 92px; top: 124px"><dc-import name="Critter" el="aigua" px="34" hint-size="34px,34px"></dc-import></div>
<div style="position: absolute; left: 196px; top: 116px"><dc-import name="Critter" el="planta" px="36" hint-size="36px,36px"></dc-import></div>
<div style="position: absolute; left: 76px; top: 188px"><dc-import name="Critter" el="foc" px="32" hint-size="32px,32px"></dc-import></div>
<div style="position: absolute; left: 150px; top: 192px"><dc-import name="Critter" el="psiquic" px="34" hint-size="34px,34px"></dc-import></div>
<div style="position: absolute; left: 96px; top: 108px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 12px; color: #34405A">z z</div>
</div>

<div style="margin: 10px 12px 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 800"><span>Places per a bestioles</span><span>6 de 8</span></div>
<div style="height: 10px; border-radius: 999px; background: #EADFCC; overflow: hidden"><div style="width: 75%; height: 10px; background: #3DAA5C; border-radius: 999px"></div></div>
<div style="font-size: 12px; color: #34405A">Gotim descansa: li queden 2 exploracions a casa.</div>
</div>

<div style="margin: 12px 12px 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px">Construir i decorar</div>
<div style="margin: 6px 12px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; flex-grow: 1; align-content: start">
<sc-for list="{{build}}" as="b" hint-placeholder-count="6">
<button style="border-radius: 16px; border: none; background: #FFFFFF; padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: 'Nunito', sans-serif; color: #1E1B2E; cursor: pointer">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{b.c}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.d}}"></path></svg>
<span style="font-size: 12px; font-weight: 800">{{b.name}}</span>
<span style="font-size: 10px; font-weight: 700; color: #34405A; text-align: center; line-height: 1.2">{{b.what}}</span>
<span style="font-size: 11px; font-weight: 800; color: #8A5A00">{{b.price}}</span>
</button>
</sc-for>
</div>

<dc-import name="Nav" active="casa" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      build: [
        { name: 'Habitació', what: '+2 places', price: '600', c: '#8A5A3C', d: 'M4 20 V10 L12 4 L20 10 V20 Z M10 20 V14 H14 V20' },
        { name: 'Jardí', what: '+3 places', price: '900', c: '#3DAA5C', d: 'M12 20 V11 M12 13 C8 13 6 10 6 7 C10 7 12 9 12 13 Z M12 11 C16 11 18 8 18 5 C14 5 12 7 12 11 Z M4 20 H20' },
        { name: 'Piscina', what: '+2 places d’aigua', price: '1.200', c: '#2E8BE6', d: 'M3 15 Q6 12 9 15 T15 15 T21 15 M3 19 Q6 16 9 19 T15 19 T21 19 M7 12 V5 M7 5 H11' },
        { name: 'Spa', what: 'Descansen el doble', price: '1.500', c: '#9B59E0', d: 'M4 14 H20 V17 A3 3 0 0 1 17 20 H7 A3 3 0 0 1 4 17 Z M9 11 Q8 8 9 5 M13 11 Q12 8 13 5' },
        { name: 'Pista de tennis', what: 'Juguen i són feliços', price: '800', c: '#F26B3A', d: 'M3 6 H21 V18 H3 Z M12 6 V18 M3 12 H21' },
        { name: 'Mobles', what: 'Decoració', price: 'des de 50', c: '#C98A00', d: 'M5 11 V18 M19 11 V18 M4 11 H20 V14 H4 Z M7 11 V7 H17 V11' }
      ]
    };
  }
}
</script>
</body>
</html>
