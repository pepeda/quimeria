<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>Barra de navegació</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Menú principal" style="width: 390px; height: 84px; box-sizing: border-box; padding: 8px 8px 14px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 20px rgba(30,27,46,0.10); display: flex; justify-content: space-between; align-items: center; font-family: 'Nunito', sans-serif; color: #1E1B2E">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
<a href="{{t.href}}" style="width: 84px; height: 58px; border-radius: 16px; background: #FFE08A; color: #1E1B2E; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 800">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}">
<a href="{{t.href}}" style="width: 84px; height: 58px; border-radius: 16px; color: #5E5A72; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
<span>{{t.label}}</span>
</a>
</sc-if>
</sc-for>
</nav>
</x-dc>

</script>
</body>
</html>
